[build]
builder = "DOCKERFILE"
dockerfilePath = "infrastructure/docker/web/Dockerfile"
watchPatterns = ["apps/web/**", "infrastructure/docker/web/**", "packages/**", "pnpm-lock.yaml"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
